[package]
name = "kestrel"
version = "0.1.0"
edition = "2024"
description = "Token usage, cost, speed and quota for local AI coding agents"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
pangocairo = "0.22"
anyhow = "1"
async-channel = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "7"
memchr = "2"
notify = "9"
rayon = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = "3"
zstd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
